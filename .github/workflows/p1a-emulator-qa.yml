name: P1-A emulator QA

on:
  push:
    branches:
      - "prototype-1/p1-a-keyboard-chrome"

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Run visual QA on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euxo pipefail
            mkdir -p qa-artifacts
            adb shell wm size 1240x1080
            adb shell wm density 320
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell ime enable io.github.joelmomo.runeboard/.RuneBoardImeService
            adb shell ime set io.github.joelmomo.runeboard/.RuneBoardImeService
            adb shell am force-stop io.github.joelmomo.runeboard
            adb shell am start -W -n io.github.joelmomo.runeboard/.MainActivity
            sleep 2
            for i in 1 2 3 4 5 6 7 8; do
              adb shell input swipe 620 920 620 180 220
            done
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml qa-artifacts/window.xml
            python3 - <<'PY'
            import re
            import subprocess
            import xml.etree.ElementTree as ET

            root = ET.parse("qa-artifacts/window.xml").getroot()
            target = None
            for node in root.iter("node"):
                if node.attrib.get("text") == "Tap here and type with RuneBoard":
                    target = node
                    break
            if target is None:
                print("Visible texts:")
                print([node.attrib.get("text") for node in root.iter("node") if node.attrib.get("text")])
                raise SystemExit("RuneBoard test field was not found")
            match = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", target.attrib["bounds"])
            if not match:
                raise SystemExit(f"Unexpected bounds: {target.attrib.get('bounds')}")
            x1, y1, x2, y2 = map(int, match.groups())
            x, y = (x1 + x2) // 2, (y1 + y2) // 2
            print(f"Tapping test field at {x},{y}")
            subprocess.run(["adb", "shell", "input", "tap", str(x), str(y)], check=True)
            PY
            sleep 3
            adb shell dumpsys input_method > qa-artifacts/input-method.txt
            adb shell settings get secure default_input_method > qa-artifacts/default-ime.txt
            adb exec-out screencap -p > qa-artifacts/p1a-keyboard.png
            adb shell uiautomator dump /sdcard/keyboard.xml
            adb pull /sdcard/keyboard.xml qa-artifacts/keyboard.xml

      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1a-emulator-qa
          path: qa-artifacts
          if-no-files-found: warn
