name: P1-B emulator QA

on:
  push:
    branches:
      - "prototype-1/p1-b-setup-settings"

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Run settings QA on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p qa-artifacts
            adb shell wm size 1240x1080
            adb shell wm density 320
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop io.github.joelmomo.runeboard
            adb shell am start -W -n io.github.joelmomo.runeboard/.MainActivity
            sleep 2
            adb exec-out screencap -p > qa-artifacts/setup-before.png
            adb shell uiautomator dump /sdcard/setup-before.xml
            adb pull /sdcard/setup-before.xml qa-artifacts/setup-before.xml
            python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/setup-before.xml").getroot(); assert sum(n.attrib.get("text")=="SET UP" for n in r.iter("node"))==3, "Expected three SET UP states"'
            adb shell am force-stop io.github.joelmomo.runeboard
            adb shell ime enable io.github.joelmomo.runeboard/.RuneBoardImeService
            adb shell ime set io.github.joelmomo.runeboard/.RuneBoardImeService
            adb shell am start -W -n io.github.joelmomo.runeboard/.MainActivity
            sleep 2
            adb exec-out screencap -p > qa-artifacts/setup-ready.png
            adb shell uiautomator dump /sdcard/setup-ready.xml
            adb pull /sdcard/setup-ready.xml qa-artifacts/setup-ready.xml
            python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/setup-ready.xml").getroot(); assert sum(n.attrib.get("text")=="READY" for n in r.iter("node"))>=2, "Expected keyboard enabled and selected READY states"'
            adb shell input swipe 620 900 620 280 280
            adb shell input swipe 620 900 620 280 280
            sleep 1
            adb exec-out screencap -p > qa-artifacts/appearance-default.png
            adb shell uiautomator dump /sdcard/appearance-default.xml
            adb pull /sdcard/appearance-default.xml qa-artifacts/appearance-default.xml
            python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/appearance-default.xml").getroot(); assert not any(n.attrib.get("text")=="Custom style" for n in r.iter("node")), "Custom controls should be collapsed"'
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/appearance-default.xml").getroot(); n=next((x for x in r.iter("node") if x.attrib.get("text")=="Custom"),None); assert n is not None,"Custom theme card not visible"; m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib["bounds"]); x1,y1,x2,y2=map(int,m.groups()); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 1
            adb exec-out screencap -p > qa-artifacts/appearance-custom.png
            adb shell uiautomator dump /sdcard/appearance-custom.xml
            adb pull /sdcard/appearance-custom.xml qa-artifacts/appearance-custom.xml
            python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/appearance-custom.xml").getroot(); assert any(n.attrib.get("text")=="Custom style" for n in r.iter("node")), "Custom controls should be visible"'

      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1b-emulator-qa
          path: qa-artifacts
          if-no-files-found: warn
