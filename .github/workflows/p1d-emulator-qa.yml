name: P1-D final emulator regression

on:
  push:
    branches:
      - "prototype-1/p1-d-regression-gate"

permissions:
  contents: read

jobs:
  final-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run unit tests, lint and build
        run: |
          chmod +x gradlew qa/p1d-regression-smoke.sh
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Run final Android 15 emulator regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash qa/p1d-regression-smoke.sh

      - name: Upload P1-D regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1d-final-emulator-regression
          path: qa-artifacts
          if-no-files-found: warn
