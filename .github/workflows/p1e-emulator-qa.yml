name: P1-E emulator QA

on:
  push:
    branches:
      - "prototype-1/p1-e-feedback-typography"

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Run settings QA on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p qa-artifacts
            adb shell wm size 1240x1080
            adb shell wm density 320
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n io.github.joelmomo.runeboard/.MainActivity
            sleep 2
            adb exec-out screencap -p > qa-artifacts/settings-0.png
            adb shell uiautomator dump /sdcard/view0.xml
            adb pull /sdcard/view0.xml qa-artifacts/view0.xml
            adb shell input swipe 620 900 620 250 250
            adb shell uiautomator dump /sdcard/view1.xml
            adb pull /sdcard/view1.xml qa-artifacts/view1.xml
            adb exec-out screencap -p > qa-artifacts/settings-1.png
            adb shell input swipe 620 900 620 250 250
            adb shell uiautomator dump /sdcard/view2.xml
            adb pull /sdcard/view2.xml qa-artifacts/view2.xml
            adb exec-out screencap -p > qa-artifacts/settings-2.png
            adb shell input swipe 620 900 620 250 250
            adb shell uiautomator dump /sdcard/view3.xml
            adb pull /sdcard/view3.xml qa-artifacts/view3.xml
            adb exec-out screencap -p > qa-artifacts/settings-3.png
            adb shell input swipe 620 900 620 250 250
            adb shell uiautomator dump /sdcard/view4.xml
            adb pull /sdcard/view4.xml qa-artifacts/view4.xml
            adb exec-out screencap -p > qa-artifacts/settings-4.png
            adb shell input swipe 620 900 620 250 250
            adb shell uiautomator dump /sdcard/view5.xml
            adb pull /sdcard/view5.xml qa-artifacts/view5.xml
            adb exec-out screencap -p > qa-artifacts/settings-5.png
            grep -q "KEY FEEDBACK" qa-artifacts/view*.xml
            grep -q "Vibration" qa-artifacts/view*.xml
            grep -q "Sound" qa-artifacts/view*.xml
            grep -q "Key lettering" qa-artifacts/view*.xml
            grep -q "Inter" qa-artifacts/view*.xml
            grep -q "Atkinson" qa-artifacts/view*.xml
            grep -q "JetBrains Mono" qa-artifacts/view*.xml
            grep -q "Space Grotesk" qa-artifacts/view*.xml
            grep -q "Lavender" qa-artifacts/view*.xml
            grep -q "Cyan" qa-artifacts/view*.xml
            grep -q "Pink" qa-artifacts/view*.xml

      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1e-emulator-qa
          path: qa-artifacts
          if-no-files-found: warn
