name: P1-E settings menu QA

on:
  push:
    branches:
      - "prototype-1/p1-e-feedback-typography"

jobs:
  emulator-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Run compact settings QA on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p qa-artifacts
            adb shell wm size 1240x1080
            adb shell wm density 320
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            for i in $(seq 1 15); do adb shell ime list -a | grep -q "io.github.joelmomo.runeboard/.RuneBoardImeService" && break; sleep 1; done
            adb shell ime list -a | grep -q "io.github.joelmomo.runeboard/.RuneBoardImeService"
            adb shell ime enable io.github.joelmomo.runeboard/.RuneBoardImeService
            adb shell ime set io.github.joelmomo.runeboard/.RuneBoardImeService
            adb shell settings put secure enabled_accessibility_services io.github.joelmomo.runeboard/.RuneBoardControlService
            adb shell settings put secure accessibility_enabled 1
            adb shell am start -W -n io.github.joelmomo.runeboard/.MainActivity
            sleep 2
            adb shell uiautomator dump /sdcard/initial.xml
            adb pull /sdcard/initial.xml qa-artifacts/initial.xml
            adb exec-out screencap -p > qa-artifacts/initial.png
            adb shell input swipe 620 900 620 350 250
            sleep 1
            adb shell uiautomator dump /sdcard/sections.xml
            adb pull /sdcard/sections.xml qa-artifacts/sections.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/sections.xml").getroot(); n=next(x for x in r.iter("node") if x.attrib.get("text")=="APPEARANCE"); m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib["bounds"]); x1,y1,x2,y2=map(int,m.groups()); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 1
            adb shell input swipe 620 900 620 330 250
            sleep 1
            adb shell uiautomator dump /sdcard/appearance-menu.xml
            adb pull /sdcard/appearance-menu.xml qa-artifacts/appearance-menu.xml
            adb exec-out screencap -p > qa-artifacts/appearance-menu.png
            python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/appearance-menu.xml").getroot(); t=[n.attrib.get("text","") for n in r.iter("node")]; [(_ for _ in ()).throw(AssertionError(x)) for x in ["Current look","Theme","Background","Typeface","Key label color"] if x not in t]; assert "Inter" not in t and "White" not in t'
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/appearance-menu.xml").getroot(); n=next(x for x in r.iter("node") if x.attrib.get("text")=="Typeface"); m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib["bounds"]); x1,y1,x2,y2=map(int,m.groups()); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 1
            adb shell uiautomator dump /sdcard/font-picker.xml
            adb pull /sdcard/font-picker.xml qa-artifacts/font-picker.xml
            adb exec-out screencap -p > qa-artifacts/font-picker.png
            python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/font-picker.xml").getroot(); t=[n.attrib.get("text","") for n in r.iter("node")]; [(_ for _ in ()).throw(AssertionError(x)) for x in ["System","Inter","Atkinson","JetBrains Mono","Space Grotesk","MedievalSharp"] if x not in t]'
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/font-picker.xml").getroot(); n=next(x for x in r.iter("node") if x.attrib.get("text")=="MedievalSharp"); m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib["bounds"]); x1,y1,x2,y2=map(int,m.groups()); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 1
            adb shell uiautomator dump /sdcard/after-font.xml
            adb pull /sdcard/after-font.xml qa-artifacts/after-font.xml
            grep -q "MedievalSharp" qa-artifacts/after-font.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/after-font.xml").getroot(); n=next(x for x in r.iter("node") if x.attrib.get("text")=="Key label color"); m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib["bounds"]); x1,y1,x2,y2=map(int,m.groups()); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 1
            adb shell uiautomator dump /sdcard/color-picker.xml
            adb pull /sdcard/color-picker.xml qa-artifacts/color-picker.xml
            adb exec-out screencap -p > qa-artifacts/color-picker.png
            python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/color-picker.xml").getroot(); t=[n.attrib.get("text","") for n in r.iter("node")]; [(_ for _ in ()).throw(AssertionError(x)) for x in ["Theme","White","Lavender","Cyan","Green","Amber","Pink"] if x not in t]'
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/color-picker.xml").getroot(); n=next(x for x in r.iter("node") if x.attrib.get("text")=="Lavender"); m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib["bounds"]); x1,y1,x2,y2=map(int,m.groups()); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 1
            adb shell uiautomator dump /sdcard/after-color.xml
            adb pull /sdcard/after-color.xml qa-artifacts/after-color.xml
            grep -q "Lavender" qa-artifacts/after-color.xml
            adb exec-out screencap -p > qa-artifacts/after-color.png
            adb shell input swipe 620 900 620 420 250
            sleep 1
            adb shell uiautomator dump /sdcard/appearance-lower.xml
            adb pull /sdcard/appearance-lower.xml qa-artifacts/appearance-lower.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; r=ET.parse("qa-artifacts/appearance-lower.xml").getroot(); n=next(x for x in r.iter("node") if x.attrib.get("text")=="Custom style"); m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",n.attrib["bounds"]); x1,y1,x2,y2=map(int,m.groups()); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 1
            adb shell uiautomator dump /sdcard/custom-picker.xml
            adb pull /sdcard/custom-picker.xml qa-artifacts/custom-picker.xml
            adb exec-out screencap -p > qa-artifacts/custom-picker.png
            grep -q "ACCENT" qa-artifacts/custom-picker.xml
            grep -q "KEYS" qa-artifacts/custom-picker.xml

      - name: Upload emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1e-settings-menu-qa
          path: qa-artifacts
          if-no-files-found: warn
