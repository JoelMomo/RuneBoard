name: P1-E nesting QA

on:
  push:
    branches:
      - "prototype-1/p1-e-feedback-typography"

jobs:
  nesting-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Validate nested settings hierarchy
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p qa-artifacts
            adb shell wm size 1240x1080
            adb shell wm density 320
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            for i in $(seq 1 15); do adb shell ime list -a | grep -q "io.github.joelmomo.runeboard/.RuneBoardImeService" && break; sleep 1; done
            adb shell ime enable io.github.joelmomo.runeboard/.RuneBoardImeService
            adb shell ime set io.github.joelmomo.runeboard/.RuneBoardImeService
            adb shell settings put secure enabled_accessibility_services io.github.joelmomo.runeboard/.RuneBoardControlService
            adb shell settings put secure accessibility_enabled 1
            adb shell am start -W -n io.github.joelmomo.runeboard/.MainActivity
            sleep 1
            adb shell input swipe 620 900 620 300 250
            adb shell uiautomator dump /sdcard/settings.xml
            adb pull /sdcard/settings.xml qa-artifacts/settings.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as ET; root=ET.parse("qa-artifacts/settings.xml").getroot(); node=next(n for n in root.iter("node") if n.attrib.get("text")=="APPEARANCE"); m=re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",node.attrib["bounds"]); x1,y1,x2,y2=map(int,m.groups()); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 1
            adb shell uiautomator dump /sdcard/appearance.xml
            adb pull /sdcard/appearance.xml qa-artifacts/appearance.xml
            adb exec-out screencap -p > qa-artifacts/appearance-nested.png
            python3 -c 'import xml.etree.ElementTree as ET; root=ET.parse("qa-artifacts/appearance.xml").getroot(); texts=[n.attrib.get("text","") for n in root.iter("node")]; missing=[x for x in ["APPEARANCE","Current look","STYLE","LETTERING","ADVANCED","Theme","Typeface","Key label color"] if x not in texts]; assert not missing, missing'

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1e-nesting-qa
          path: qa-artifacts
          if-no-files-found: warn
